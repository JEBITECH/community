version: "3.9"

# One-VM deployment: every service in this compose file, on one Docker
# network, reachable from each other by service name. Copy .env.example to
# .env and fill in real values before running `docker compose up -d --build`.
#
# Caddy is the only thing published on the host (80/443) — it terminates TLS
# and fans out by path to client/gateway/community-svc, all of which are
# otherwise internal-only now. Socket.io's client connects directly to
# community-svc (bypassing the gateway) by hitting /socket.io/* on the same
# domain — see the Caddyfile's comment for why that one path is routed
# straight to community-svc instead of the gateway.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-community_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_DATABASE:-community_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-community_user} -d ${DB_DATABASE:-community_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-svc:
    build:
      context: .
      dockerfile: server/services/auth-svc/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      NOTIFICATION_MICROSERVICE_HOST: notification-svc
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4001"

  community-svc:
    build:
      context: .
      dockerfile: server/services/community-svc/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      NOTIFICATION_MICROSERVICE_HOST: notification-svc
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5021"

  notification-svc:
    build:
      context: .
      dockerfile: server/services/notification-svc/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5011"
      - "6011"

  gateway:
    build:
      context: .
      dockerfile: server/platform/gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Without these two overrides, gateway inherits the shared .env's
      # PORT=4001 (meant for auth-svc — gateway's own index.ts checks
      # process.env.PORT before GATEWAY_PORT) and DB_HOST=localhost
      # (meant for native dev, not this container) — see the commit that
      # added this comment for the exact symptoms both cause.
      PORT: 4000
      DB_HOST: postgres
      AUTH_SERVICE_URL: http://auth-svc:4001
      COMMUNITY_SERVICE_URL: http://community-svc:5021
      NOTIFICATION_SERVICE_URL: http://notification-svc:5011
      NOTIFICATION_MICROSERVICE_HOST: notification-svc
    depends_on:
      - auth-svc
      - community-svc
      - notification-svc
    expose:
      - "4000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_COMMUNITY_WS_URL: ${VITE_COMMUNITY_WS_URL:-http://localhost:5021}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - gateway

  client-web:
    build:
      context: .
      dockerfile: client-web/Dockerfile
      args:
        # Baked into the browser bundle at build time — must be a public URL
        # (the browser can't resolve Docker service names). Same rationale as
        # the client's VITE_COMMUNITY_WS_URL above.
        NEXT_PUBLIC_COMMUNITY_WS_URL: ${VITE_COMMUNITY_WS_URL:-http://localhost:5021}
    restart: unless-stopped
    env_file: .env
    environment:
      # The Next server reads PORT/HOSTNAME to decide what it binds. The
      # shared .env's PORT=4001 (meant for auth-svc) and NODE_ENV=development
      # arrive via env_file above and would otherwise leak in, so pin them
      # here — CLIENT_WEB_PORT is the app's own dedicated port variable.
      NODE_ENV: production
      PORT: ${CLIENT_WEB_PORT:-5175}
      HOSTNAME: 0.0.0.0
      # The Next server evaluates the /api/* rewrite at request time, so it
      # proxies to the gateway container rather than localhost.
      GATEWAY_URL: http://gateway:4000
    depends_on:
      - gateway
    expose:
      - "${CLIENT_WEB_PORT:-5175}"
    # Published directly so the site is reachable at http://localhost:<port>
    # for local Docker runs, without depending on Caddy + public DNS/TLS
    # (the subdomain in the Caddyfile only resolves on the real deployment).
    ports:
      - "${CLIENT_WEB_PORT:-5175}:${CLIENT_WEB_PORT:-5175}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - client-web
      - gateway
      - community-svc

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

<!DOCTYPE html>
<html lang="en" data-org="green-acres">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propose an Idea</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="page-member">
<div class="proto-bar"><span><a href="../index.html">◀ All screens</a> <span class="proto-crumb">/ Member / Create Idea</span></span></div>

<header class="topbar">
  <div class="brand"><div class="logo-mark">GA</div> Green Acres Society</div>
  <nav><a href="dashboard.html">Home</a><a href="explore.html">Explore</a><a href="calendar.html">Calendar</a><a href="feed.html">Community</a></nav>
  <div class="topbar-actions"><a href="profile.html"><div class="avatar" style="width:36px;height:36px;">JB</div></a></div>
</header>

<main class="container-narrow" style="padding-top:24px;padding-bottom:60px;max-width:520px;">
  <a class="text-sm" href="idea-board.html" style="color:var(--color-primary);font-weight:700;">← Idea Board</a>
  <h1 class="h2" style="margin-top:8px;">Propose an Idea</h1>
  <p class="text-muted text-sm" style="margin-top:4px;">No commitment needed — just gauge interest first.</p>

  <div class="card card-pad" style="margin-top:18px;">
    <div class="field"><label>Idea title</label><input class="input" placeholder="e.g. Sunday Farmers Market"></div>
    <div class="field"><label>Description</label><textarea class="input" rows="4" placeholder="What's the idea? Who's it for?"></textarea></div>
    <div class="field"><label>Category</label><select class="input"><option>Culture</option><option>Sports</option><option>Training</option><option>Social</option></select></div>
    <div class="row-between" style="margin-top:6px;"><span class="text-sm">Open to co-organizers?</span><div class="switch on" data-switch></div></div>
    <div class="row-between" style="margin-top:10px;"><span class="text-sm">Might need sponsorship?</span><div class="switch" data-switch></div></div>
    <a class="btn btn-primary btn-block" style="margin-top:18px;" href="idea-board.html">Post Idea</a>
  </div>
</main>
<script src="../assets/app.js"></script>
</body>
</html>
